{{- if not .Values.global.existingSecret }}
{{- /*
SECRET_KEY and AGENTS_MCP_JWT_SECRET sign tokens, so they must never be a value
anyone can read in this chart. Left empty (the default) or set to a placeholder
older chart versions shipped, each one is generated once and then read back
from the release's Secret on every upgrade, so sessions survive upgrades.
*/}}
{{- $secretName := printf "%s-secrets" (include "securo.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if $existing }}{{- $existingData = $existing.data | default dict }}{{- end }}
{{- $publishedDefaults := list "change-me-in-production" "dev-secret-change-in-production" "dev-mcp-secret-change-in-production" }}
{{- $data := dict }}
{{- range $key, $value := .Values.secret }}
{{- if $value }}
{{- $_ := set $data ($key | snakecase | upper) (tpl (print $value) $ | b64enc) }}
{{- end }}
{{- end }}
{{- range $envVar := list "SECRET_KEY" "AGENTS_MCP_JWT_SECRET" }}
{{- $current := "" }}
{{- if hasKey $data $envVar }}{{- $current = index $data $envVar | b64dec }}{{- end }}
{{- if or (not $current) (has $current $publishedDefaults) }}
{{- $stored := "" }}
{{- if hasKey $existingData $envVar }}{{- $stored = index $existingData $envVar | b64dec }}{{- end }}
{{- if and $stored (not (has $stored $publishedDefaults)) }}
{{- $_ := set $data $envVar ($stored | b64enc) }}
{{- else }}
{{- $_ := set $data $envVar (randAlphaNum 64 | b64enc) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "securo.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
